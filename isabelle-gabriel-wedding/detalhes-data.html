<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data e Horário | Isabelle &amp; Gabriel</title>

  <!-- Favicon monograma -->
  <link rel="icon" href="assets/monograma.png" type="image/png">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Outfit:wght@200;300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2a5c24',       
            primaryDark: '#1e4620',   
            champagne: '#f0ebe0',     
            accentGold: '#D4AF37',    
            fendi: '#7A756B',         
            lightBg: '#f7f4ee'        
          },
          fontFamily: {
            serif: ['Cormorant Garamond', 'serif'],
            sans: ['"Courier Prime"', 'monospace'],
            outfit: ['Outfit', 'sans-serif'],
            script: ['Great Vibes', 'cursive'],
            display: ['Cinzel', 'serif']
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      background-image: url('assets/paper_texture.jpg');
      background-repeat: repeat;
    }
  </style>
</head>
<body class="font-sans bg-lightBg text-stone-800 min-h-screen flex flex-col">

  <!-- Header / Navigation -->
  <header class="py-6 border-b border-stone-200/50 bg-white/70 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 flex items-center justify-between">
      <a href="index.html#evento" class="inline-flex items-center gap-2 text-stone-600 hover:text-primary transition font-outfit text-xs font-semibold uppercase tracking-wider">
        <i data-lucide="arrow-left" class="h-4 w-4"></i> Voltar ao site
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow max-w-3xl mx-auto px-4 py-12 w-full">
    <!-- Content wrapper directly on paper texture -->
    <div class="space-y-12 py-4 px-2 sm:px-6">
      
      <!-- Page Title -->
      <div class="text-center space-y-2">
        <span class="font-display text-accentGold text-sm tracking-widest uppercase">A Celebração</span>
        <h1 class="font-display text-3xl sm:text-4xl font-normal text-primary tracking-wide uppercase">Data e Horário</h1>
        <div class="h-0.5 w-16 bg-primary/20 mx-auto"></div>
      </div>
      <!-- Highlight Text -->
      <div class="text-center space-y-2 max-w-xl mx-auto">
        <p class="font-outfit text-primary font-semibold text-lg sm:text-2xl uppercase tracking-wide">
          12 de Setembro de 2026, às 15h30
        </p>
      </div>

      <!-- Invitation Image -->
      <div class="space-y-4 max-w-lg mx-auto text-center">
        <div class="p-2 rounded-2xl flex items-center justify-center">
          <img src="assets/convite_completo.jpg" alt="Convite Oficial Completo" class="max-w-full h-auto object-contain rounded-xl shadow-md">
        </div>
      </div>

      <!-- Call to Action -->
      <div class="text-center pt-4">
        <a href="index.html#rsvp" class="inline-flex items-center gap-2 bg-primary hover:bg-primaryDark text-white px-8 py-3.5 rounded-xl font-outfit text-xs font-bold uppercase tracking-wider transition shadow-md">
          Confirmar Presença
        </a>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="py-8 text-center text-xs text-stone-400 font-sans border-t border-stone-200/50 bg-white/30 mt-auto">
    <p>Isabelle &amp; Gabriel • Setembro de 2026</p>
  </footer>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
